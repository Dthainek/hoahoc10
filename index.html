<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Trò Chơi Hóa Học</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1a237e, #0d1117);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      text-align: center;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }
    p.subtitle {
      color: #90caf9;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 900px;
    }
    .game-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 30px 20px;
      text-decoration: none;
      color: white;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .game-card:hover {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.12);
      border-color: #00e5ff;
      box-shadow: 0 10px 25px rgba(0, 229, 255, 0.25);
    }
    .game-icon {
      font-size: 3rem;
    }
    .game-title {
      font-size: 1.3rem;
      font-weight: 600;
    }
    .game-desc {
      font-size: 0.9rem;
      color: #b0bec5;
    }
  </style>
</head>
<body>
  <h1>Vui Học Cùng Minigame</h1>
  <p class="subtitle">Chọn trò chơi bạn muốn tham gia:</p>

  <div class="game-grid">
    <a href="./ailatrieuphu/" class="game-card">
      <div class="game-icon">🏆</div>
      <div class="game-title">Ai Là Triệu Phú</div>
      <div class="game-desc">Thử thách kiến thức trắc nghiệm Hóa học 10</div>
    </a>

    <a href="./thenguyento/" class="game-card">
      <div class="game-icon">⚛️</div>
      <div class="game-title">Thẻ Nguyên Tố</div>
      <div class="game-desc">Khám phá và nhận diện các nguyên tố hóa học</div>
    </a>

    <a href="./tohinhdoanchu/" class="game-card">
      <div class="game-icon">🧩</div>
      <div class="game-title">Tô Hình Đoán Chữ</div>
      <div class="game-desc">Giải trắc nghiệm ghép tranh 20 - 11 đặc biệt</div>
    </a>
  </div>
</body>
</html>
